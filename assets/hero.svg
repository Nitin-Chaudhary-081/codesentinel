<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="CodeSentinel — AI code review and evaluation">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#052e16"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#065f46"/>
      <stop offset="1" stop-color="#022c22"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="400" rx="20" fill="url(#bg)"/>

  <!-- left: text -->
  <g font-family="sans-serif">
    <text x="60" y="120" fill="#e2e8f0" font-size="34" font-weight="700">Code<span fill="url(#cyber)">Sentinel</span></text>
    <text x="60" y="158" fill="#94a3b8" font-size="16">AI-powered code review &amp; evaluation</text>
    <text x="60" y="186" fill="#cbd5e1" font-size="13">complexity &#183; naming &#183; error handling &#183; security</text>
    <text x="60" y="210" fill="#64748b" font-size="12">Next.js 15 + Flask 3.1 + PostgreSQL &#183; JSONL export</text>
    <line x1="60" y1="228" x2="330" y2="228" stroke="url(#cyber)" stroke-width="2" opacity="0.6"/>
  </g>

  <!-- center: shield + scanning code -->
  <g transform="translate(620 195)">
    <!-- radar sweep -->
    <circle r="120" fill="none" stroke="#34d399" stroke-width="1" opacity="0.25"/>
    <line x1="0" y1="0" x2="120" y2="0" stroke="#34d399" stroke-width="1.5" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="5s" repeatCount="indefinite"/>
    </line>

    <!-- shield -->
    <path d="M0 -95 L78 -62 V10 Q78 78 0 100 Q-78 78 -78 10 V-62 Z" fill="url(#shield)" stroke="#34d399" stroke-width="3"/>
    <path d="M0 -70 L56 -45 V10 Q56 60 0 78 Q-56 60 -56 10 V-45 Z" fill="#022c22" stroke="none"/>
    <!-- shield check -->
    <path d="M-26 0 L-8 18 L28 -20" fill="none" stroke="#4ade80" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
      <animate attributeName="stroke-dasharray" values="0 300;300 0" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- eye / scanner dot -->
    <circle cx="0" cy="0" r="6" fill="#22d3ee" filter="url(#glow)">
      <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- horizontal scanning beam over code -->
    <rect x="-150" y="120" width="300" height="46" rx="6" fill="#052e16" stroke="#334155" stroke-width="1.5"/>
    <g font-family="monospace" font-size="9">
      <text x="-140" y="138" fill="#94a3b8">def evaluate(code):</text>
      <text x="-140" y="154" fill="#64748b">    score = analyze(code)</text>
    </g>
    <rect x="-150" y="120" width="300" height="3" fill="#34d399" opacity="0.9">
      <animate attributeName="y" values="120;166;120" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2.2s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- right: dimension score bars -->
  <g transform="translate(900 60)">
    <text x="0" y="18" font-family="sans-serif" font-size="13" fill="#e2e8f0" font-weight="600">Evaluation</text>
    <g font-family="sans-serif" font-size="10" fill="#94a3b8">
      <text x="0" y="50">complexity</text>
      <rect x="90" y="38" width="180" height="8" rx="4" fill="#1e293b"/>
      <rect x="90" y="38" width="0" height="8" rx="4" fill="#34d399">
        <animate attributeName="width" values="0;170" dur="1.6s" fill="freeze"/>
      </rect>
      <text x="0" y="76">naming</text>
      <rect x="90" y="64" width="180" height="8" rx="4" fill="#1e293b"/>
      <rect x="90" y="64" width="0" height="8" rx="4" fill="#22d3ee">
        <animate attributeName="width" values="0;150" dur="1.6s" fill="freeze" begin="0.4s"/>
      </rect>
      <text x="0" y="102">security</text>
      <rect x="90" y="90" width="180" height="8" rx="4" fill="#1e293b"/>
      <rect x="90" y="90" width="0" height="8" rx="4" fill="#f472b6">
        <animate attributeName="width" values="0;185" dur="1.6s" fill="freeze" begin="0.8s"/>
      </rect>
      <text x="0" y="128">maintainability</text>
      <rect x="90" y="116" width="180" height="8" rx="4" fill="#1e293b"/>
      <rect x="90" y="116" width="0" height="8" rx="4" fill="#a855f7">
        <animate attributeName="width" values="0;160" dur="1.6s" fill="freeze" begin="1.2s"/>
      </rect>
      <text x="90" y="150" fill="#64748b" font-size="9">92% test coverage &#183; 0 vulnerabilities</text>
    </g>
  </g>

  <!-- floating language chips -->
  <g font-family="monospace" font-size="11" text-anchor="middle">
    <rect x="800" y="330" width="64" height="22" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
    <text x="832" y="345" fill="#38bdf8">Python</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="3s" repeatCount="indefinite"/>
  </g>
  <g font-family="monospace" font-size="11" text-anchor="middle">
    <rect x="880" y="322" width="70" height="22" rx="6" fill="#1e293b" stroke="#fbbf24" stroke-width="1"/>
    <text x="915" y="337" fill="#fbbf24">TypeScript</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="3.6s" repeatCount="indefinite" begin="0.5s"/>
  </g>
  <g font-family="monospace" font-size="11" text-anchor="middle">
    <rect x="965" y="330" width="52" height="22" rx="6" fill="#1e293b" stroke="#34d399" stroke-width="1"/>
    <text x="991" y="345" fill="#34d399">Go</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="3.2s" repeatCount="indefinite" begin="1s"/>
  </g>
  <g font-family="monospace" font-size="11" text-anchor="middle">
    <rect x="1032" y="322" width="64" height="22" rx="6" fill="#1e293b" stroke="#f472b6" stroke-width="1"/>
    <text x="1064" y="337" fill="#f472b6">Java</text>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -10;0 0" dur="3.4s" repeatCount="indefinite" begin="1.5s"/>
  </g>
</svg>